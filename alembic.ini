; Alembic configuration.
;
; Note there is no `sqlalchemy.url` here on purpose: the URL is injected by
; migrations/env.py from the validated application settings, so credentials
; live only in the environment and never in a tracked file.

[alembic]
script_location = migrations

; Lets `alembic` be run from the repository root without installing the
; package, so `import app...` resolves inside env.py.
prepend_sys_path = .

; Revision files are prefixed with a UTC timestamp, which keeps `ls` ordering
; the same as migration ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

; Fail loudly rather than silently skipping a revision whose down_revision is
; missing from this tree.
revision_environment = false
sourceless = false

version_path_separator = os


[post_write_hooks]
; Format every generated revision so autogenerated files match the style of
; hand-written ones.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

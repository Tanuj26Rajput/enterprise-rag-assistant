[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "var"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy's declarative base assigns a shared MetaData by design, and
# migrations are historical records that should not be refactored.
"app/db/base.py" = ["RUF012"]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
